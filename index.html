<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patient Portal</title>
<style>
:root{--bg:#f4f7f8;--card:#fff;--ink:#16262b;--mute:#5b6e74;--line:#d5dfe2;--accent:#0b5f66;--accent-ink:#fff;--bad:#a4262c}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a1d;--card:#16262b;--ink:#e8f0f2;--mute:#9db0b6;--line:#2b4046;--accent:#5cc2c9;--accent-ink:#0f1a1d;--bad:#ff8c90}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,'Times New Roman',serif}
h1,h2,h3,button,input,select,textarea,nav{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:1.1rem;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
nav button{background:none;border:1px solid var(--line);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer}
nav button[aria-current=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:14px}
.row{padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row small{color:var(--mute)}
label{display:block;font:600 .85rem system-ui;margin:10px 0 3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:1rem}
.btn{background:var(--accent);color:var(--accent-ink);border:0;padding:9px 16px;border-radius:6px;cursor:pointer;margin-top:12px;font-weight:600}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent);padding:4px 10px;margin:0 0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}
.err{color:var(--bad);font:.9rem system-ui;min-height:1.3em}.ok{color:var(--accent);font:.9rem system-ui}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.msg-staff{border-left:3px solid var(--accent);padding-left:10px}
</style></head><body>
<header><h1 id="brand">Patient Portal</h1><div id="who"></div></header>
<main id="app"></main>
<script src="/app.js"></script></body></html>
